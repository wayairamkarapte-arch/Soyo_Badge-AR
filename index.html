<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Badge Animation AR</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,sans-serif}#status{position:fixed;top:16px;left:12px;right:12px;z-index:10;background:#111b;color:white;padding:12px;border-radius:10px;text-align:center;font-size:14px}#gear{position:fixed;right:15px;bottom:25px;z-index:11;border:0;border-radius:50%;background:#222c;color:white;font-size:24px;width:52px;height:52px}#panel{display:none;position:fixed;z-index:11;left:12px;right:12px;bottom:85px;background:#111e;color:white;border-radius:12px;padding:16px}#panel label{display:block;margin:8px 0}#panel input{width:100%}#panel button{padding:8px}a-scene{position:fixed!important;inset:0;z-index:1!important;background:transparent!important}a-scene canvas,.a-canvas{background:transparent!important}video{object-fit:cover!important}#status,#gear,#panel{position:fixed}</style>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script>
const defaults={x:0,y:0,scale:1,rotation:0};let settings={...defaults};try{settings={...settings,...JSON.parse(localStorage.getItem('badge-ar-settings')||'{}')}}catch(e){}
AFRAME.registerComponent('badge-animation',{
init:function(){const self=this;this.videoImage=new Image();this.videoImage.src='./assets/animation.webp';this.canvas=document.createElement('canvas');this.canvas.width=500;this.canvas.height=500;this.ctx=this.canvas.getContext('2d');this.texture=new THREE.CanvasTexture(this.canvas);this.texture.colorSpace=THREE.SRGBColorSpace;this.texture.minFilter=THREE.LinearFilter;this.material=new THREE.MeshBasicMaterial({map:this.texture,transparent:true,side:THREE.DoubleSide,depthWrite:false,toneMapped:false});this.el.addEventListener('object3dset',()=>self.apply());this.videoImage.onload=()=>self.apply();this.apply()},
apply:function(){const mesh=this.el.getObject3D('mesh');if(mesh)mesh.material=this.material;this.el.object3D.position.set(settings.x,settings.y,0.015);this.el.object3D.rotation.z=settings.rotation*Math.PI/180;this.el.object3D.scale.set(settings.scale,settings.scale,1)},
tick:function(){if(!this.videoImage.complete||!this.videoImage.naturalWidth)return;this.ctx.clearRect(0,0,500,500);this.ctx.drawImage(this.videoImage,0,0,500,500);this.texture.needsUpdate=true},
remove:function(){this.texture.dispose();this.material.dispose()}
});
</script></head><body><div id="status">缶バッジを映してください</div><button id="gear" aria-label="位置調整">⚙</button><div id="panel"><b>アニメーション位置調整</b><label>左右<input id="x" type="range" min="-0.5" max="0.5" step="0.005"></label><label>上下<input id="y" type="range" min="-0.5" max="0.5" step="0.005"></label><label>大きさ<input id="scale" type="range" min="0.2" max="2.5" step="0.01"></label><label>回転<input id="rotation" type="range" min="-180" max="180" step="1"></label><button id="reset">初期位置に戻す</button><p style="font-size:12px">位置はこの端末に保存されます。</p></div>
<a-scene mindar-image="imageTargetSrc: ./badge_target.mind; autoStart: true;" renderer="colorManagement:true;alpha:true;antialias:true" color-space="sRGB" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" embedded><a-camera position="0 0 0" look-controls="enabled:false"></a-camera><a-entity id="target" mindar-image-target="targetIndex: 0"><a-plane width="1" height="1" badge-animation></a-plane></a-entity></a-scene>
<script>
// MindAR places its camera video behind the WebGL canvas by default.
// Make the camera layer explicit so it is not hidden by the opaque page.
function ensureCameraLayer(){
  // Keep MindAR's own camera-video positioning; forcing it into a new stacking context can hide it.
  document.querySelectorAll('video').forEach(v=>{v.style.visibility='visible';v.style.opacity='1';});
  const scene=document.querySelector('a-scene');
  if(scene&&scene.renderer){scene.renderer.setClearColor(0x000000,0);scene.renderer.setClearAlpha(0);scene.renderer.autoClear=true;}
}
new MutationObserver(ensureCameraLayer).observe(document.body,{childList:true,subtree:true});
document.querySelector('a-scene').addEventListener('renderstart',ensureCameraLayer);
const status=document.getElementById('status'),target=document.getElementById('target');target.addEventListener('targetFound',()=>status.style.display='none');target.addEventListener('targetLost',()=>{status.textContent='缶バッジを映してください';status.style.display='block'});document.querySelector('a-scene').addEventListener('arError',()=>{status.textContent='AR起動エラー：カメラの許可とbadge_target.mindを確認してください';status.style.display='block'});
const panel=document.getElementById('panel');document.getElementById('gear').onclick=()=>panel.style.display=panel.style.display==='block'?'none':'block';function update(){for(const key of Object.keys(defaults)){settings[key]=Number(document.getElementById(key).value)}localStorage.setItem('badge-ar-settings',JSON.stringify(settings));target.querySelector('[badge-animation]').components['badge-animation']?.apply()};for(const key of Object.keys(defaults)){const el=document.getElementById(key);el.value=settings[key];el.addEventListener('input',update)}document.getElementById('reset').onclick=()=>{settings={...defaults};for(const key of Object.keys(defaults))document.getElementById(key).value=settings[key];update()};
</script></body></html>
