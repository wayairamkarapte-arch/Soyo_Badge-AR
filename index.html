<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Soyo AR 動画確認</title><style>html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui}#diag{position:fixed;z-index:9999;top:8px;left:8px;right:8px;background:#111e;color:#fff;border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;pointer-events:none}#preview{position:fixed;z-index:9999;right:8px;bottom:68px;width:130px;height:65px;background:#666;border:1px solid #fff}#start{position:fixed;z-index:9999;bottom:12px;left:12px;border:0;background:#fff;padding:12px;border-radius:7px}a-scene{position:fixed!important;inset:0;background:transparent!important}a-scene canvas{background:transparent!important}</style><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><script>let meshState='未生成',shaderState='未生成',found=false,errs=[];AFRAME.registerComponent('badge-video',{init:function(){const v=document.getElementById('preview');const T=AFRAME.THREE;this.tex=new T.VideoTexture(v);this.tex.minFilter=T.LinearFilter;this.tex.magFilter=T.LinearFilter;this.mat=new T.ShaderMaterial({uniforms:{videoMap:{value:this.tex}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'precision mediump float;uniform sampler2D videoMap;varying vec2 vUv;void main(){vec3 rgb=texture2D(videoMap,vec2(vUv.x*.5,vUv.y)).rgb;float a=texture2D(videoMap,vec2(.5+vUv.x*.5,vUv.y)).r;gl_FragColor=vec4(rgb,a);}',transparent:true,depthWrite:false,side:T.DoubleSide});this.el.addEventListener('object3dset',()=>this.apply());this.apply()},apply:function(){const m=this.el.getObject3D('mesh');if(m){m.material=this.mat;meshState='接続済';shaderState='接続済';m.renderOrder=10}else{meshState='未生成'}},remove:function(){this.tex.dispose();this.mat.dispose()}});window.addEventListener('error',e=>errs.push((e.message||'error').slice(0,120)));window.addEventListener('unhandledrejection',e=>errs.push(String(e.reason).slice(0,120)));</script></head><body><div id="diag">確認中…</div><video id="preview" muted playsinline webkit-playsinline autoplay loop preload="auto" src="./assets/soyo_alpha.mp4"></video><button id="start">動画を再生</button><a-scene mindar-image="imageTargetSrc: ./badge_target.mind; autoStart: true" renderer="colorManagement:true;alpha:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" embedded><a-camera position="0 0 0" look-controls="enabled:false"></a-camera><a-entity id="target" mindar-image-target="targetIndex: 0"><a-plane width="0.78" height="0.78" badge-video></a-plane></a-entity></a-scene><script>const v=document.getElementById('preview'),d=document.getElementById('diag'),scene=document.querySelector('a-scene');document.getElementById('start').onclick=()=>v.play().catch(e=>errs.push('再生:'+e.message));document.getElementById('target').addEventListener('targetFound',()=>found=true);document.getElementById('target').addEventListener('targetLost',()=>found=false);scene.addEventListener('renderstart',()=>{scene.renderer?.setClearColor(0,0);v.play().catch(()=>{})});scene.addEventListener('arError',e=>errs.push('AR error'));v.addEventListener('error',()=>errs.push('動画 error code '+v.error?.code));setInterval(()=>{const c=scene.querySelector('[badge-video]')?.components['badge-video'];d.textContent='AR認識: '+(found?'成功':'未認識')+'\n動画読み込み: '+v.readyState+'/4\n動画再生: '+(!v.paused?'再生中':'停止')+' / '+v.currentTime.toFixed(1)+'秒\n動画サイズ: '+v.videoWidth+'×'+v.videoHeight+'\nAR表示面: '+meshState+'\nコンポーネント: '+(c?'あり':'なし')+'\nエラー: '+(errs.slice(-2).join(' | ')||'なし');},500);</script></body></html>
