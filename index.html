<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1,user-scalable=no"><title>Soyo Badge AR</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,sans-serif}#status{position:fixed;top:12px;left:12px;right:12px;z-index:1000;padding:10px 14px;border-radius:8px;background:rgba(0,0,0,.7);color:white;text-align:center;font-size:13px;pointer-events:none}#gear{position:fixed;right:15px;bottom:25px;z-index:1001;border:0;border-radius:50%;background:#222c;color:white;font-size:24px;width:52px;height:52px}#panel{display:none;position:fixed;z-index:1001;left:12px;right:12px;bottom:85px;background:#111e;color:white;border-radius:12px;padding:16px}#panel label{display:block;margin:8px 0}#panel input{width:100%}#panel button{padding:8px}a-scene{position:fixed!important;inset:0;z-index:1!important;background:transparent!important}a-scene canvas,.a-canvas{background:transparent!important}#alphaVideo{position:absolute;top:-9999px;left:-9999px;width:1px;height:1px;pointer-events:none}</style>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script>
const defaults={x:0,y:0,scale:0.78,rotation:0};let settings={...defaults};try{settings={...settings,...JSON.parse(localStorage.getItem('badge-ar-settings')||'{}')}}catch(e){}
AFRAME.registerComponent('soyo-video-canvas',{
init:function(){
 this.video=document.getElementById('alphaVideo');this.canvas=document.createElement('canvas');this.canvas.width=500;this.canvas.height=500;this.ctx=this.canvas.getContext('2d',{willReadFrequently:true});
 this.sourceCanvas=document.createElement('canvas');this.sourceCanvas.width=1000;this.sourceCanvas.height=500;this.sourceCtx=this.sourceCanvas.getContext('2d',{willReadFrequently:true});
 this.texture=null;this.lastVideoTime=-1;this.ready=false;this.applyPosition();
},
applyPosition:function(){this.el.object3D.position.set(settings.x,settings.y,0.02);this.el.object3D.rotation.z=settings.rotation*Math.PI/180;this.el.object3D.scale.set(settings.scale,settings.scale,1)},
tick:function(){
 const mesh=this.el.getObject3D('mesh');if(!mesh)return;
 // Same approach as the previously working ChibiSoyo AR: attach CanvasTexture only after mesh exists, in tick().
 if(!this.texture){this.texture=new THREE.CanvasTexture(this.canvas);this.texture.minFilter=THREE.LinearFilter;this.texture.generateMipmaps=false;const material=new THREE.MeshBasicMaterial({map:this.texture,transparent:true,side:THREE.DoubleSide,depthWrite:false,toneMapped:false});if(mesh.material)mesh.material.dispose();mesh.material=material;this.ready=true;}
 const v=this.video;if(v.readyState<2||v.videoWidth===0)return;
 if(v.currentTime===this.lastVideoTime)return;this.lastVideoTime=v.currentTime;
 // Input H.264: left half RGB, right half alpha mask. Restore RGBA in 2D canvas.
 try{this.sourceCtx.drawImage(v,0,0,1000,500);const src=this.sourceCtx.getImageData(0,0,1000,500);const dst=this.ctx.createImageData(500,500);const s=src.data,d=dst.data;for(let i=0;i<250000;i++){const y=Math.floor(i/500),x=i%500,p=(y*1000+x)*4,q=(y*1000+x+500)*4,k=i*4;d[k]=s[p];d[k+1]=s[p+1];d[k+2]=s[p+2];d[k+3]=s[q];}this.ctx.putImageData(dst,0,0);this.texture.needsUpdate=true;}catch(e){document.getElementById('status').textContent='動画描画エラー: '+e.message;document.getElementById('status').style.display='block'}
},remove:function(){if(this.texture)this.texture.dispose()}
});
</script></head><body>
<div id="status">カメラを起動しています…</div><video id="alphaVideo" muted autoplay loop playsinline webkit-playsinline preload="auto" crossorigin="anonymous" src="./assets/soyo_alpha.mp4"></video>
<button id="gear" aria-label="位置調整">⚙</button><div id="panel"><b>アニメーション位置調整</b><label>左右<input id="x" type="range" min="-0.5" max="0.5" step="0.005"></label><label>上下<input id="y" type="range" min="-0.5" max="0.5" step="0.005"></label><label>大きさ<input id="scale" type="range" min="0.2" max="2.5" step="0.01"></label><label>回転<input id="rotation" type="range" min="-180" max="180" step="1"></label><button id="reset">初期位置に戻す</button></div>
<a-scene mindar-image="imageTargetSrc: ./badge_target.mind; autoStart: true;" color-space="sRGB" renderer="colorManagement: true; alpha: true;" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" embedded><a-camera position="0 0 0" look-controls="enabled:false"></a-camera><a-entity mindar-image-target="targetIndex: 0" id="target"><a-plane position="0 0 0.02" width="1" height="1" soyo-video-canvas></a-plane></a-entity></a-scene>
<script>
const status=document.getElementById('status'),target=document.getElementById('target'),video=document.getElementById('alphaVideo'),scene=document.querySelector('a-scene');
function startVideo(){video.muted=true;video.play().catch(()=>{status.textContent='画面をタップして動画を開始してください';status.style.display='block'})}
scene.addEventListener('renderstart',()=>{if(scene.renderer){scene.renderer.setClearColor(0x000000,0);scene.renderer.setClearAlpha(0)}status.textContent='缶バッジを映してください';startVideo()});
document.addEventListener('pointerdown',startVideo,{passive:true});video.addEventListener('error',()=>{status.textContent='動画ファイルが読み込めません（assets/soyo_alpha.mp4）';status.style.display='block'});
target.addEventListener('targetFound',()=>{status.style.display='none';startVideo()});target.addEventListener('targetLost',()=>{status.textContent='缶バッジを映してください';status.style.display='block'});scene.addEventListener('arError',()=>{status.textContent='AR起動エラー：カメラ許可と認識ファイルを確認してください';status.style.display='block'});
const panel=document.getElementById('panel');document.getElementById('gear').onclick=()=>panel.style.display=panel.style.display==='block'?'none':'block';function update(){for(const k of Object.keys(defaults))settings[k]=Number(document.getElementById(k).value);localStorage.setItem('badge-ar-settings',JSON.stringify(settings));target.querySelector('[soyo-video-canvas]').components['soyo-video-canvas']?.applyPosition()};for(const k of Object.keys(defaults)){const e=document.getElementById(k);e.value=settings[k];e.addEventListener('input',update)}document.getElementById('reset').onclick=()=>{settings={...defaults};for(const k of Object.keys(defaults))document.getElementById(k).value=settings[k];update()};
</script></body></html>
